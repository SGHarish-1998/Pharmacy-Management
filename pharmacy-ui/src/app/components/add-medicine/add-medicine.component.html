<div class="container">
  <h1>Add New Medicine</h1>
  <form (ngSubmit)="onSubmit()" #medicineForm="ngForm">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" [(ngModel)]="medicine.fullName" required>
    </div>
    <div class="form-group">
      <label for="brand">Brand</label>
      <input type="text" id="brand" name="brand" [(ngModel)]="medicine.brand" required>
    </div>
    <div class="form-group">
      <label for="expiry">Expiry Date</label>
      <input type="date" id="expiry" name="expiry" [(ngModel)]="medicine.expiryDate" required>
    </div>
    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" [(ngModel)]="medicine.quantity" required min="0">
    </div>
    <div class="form-group">
      <label for="price">Price</label>
      <input type="number" id="price" name="price" [(ngModel)]="medicine.price" required min="0" step="0.01">
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" [(ngModel)]="medicine.notes" rows="4"></textarea>
    </div>
    <div class="actions">
      <button type="submit" [disabled]="!medicineForm.valid">Add Medicine</button>
      <button type="button" class="cancel" (click)="router.navigate(['/'])">Cancel</button>
    </div>
  </form>
</div>
